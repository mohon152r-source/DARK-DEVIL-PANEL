<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DARK DEVIL PANEL - Admin Login</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <main class="container">

    <section class="brand">
      <h1>DARK DEVIL</h1>
      <p>CONTROL PANEL</p>
    </section>

    <section class="login-box">

      <div class="login-header">
        <h2>ADMIN LOGIN</h2>
        <p>Sign in to continue</p>
      </div>

      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
              aria-label="Show password"
            >👁</button>

          </div>

        </div>

        <div
          id="loginMessage"
          class="message"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          id="loginButton"
        >
          🔒 LOGIN
        </button>

      </form>

      <div class="secure">
        <span></span>
        <div>SECURE ADMIN ACCESS</div>
        <span></span>
      </div>

    </section>

    <footer class="footer">
      DARK DEVIL PANEL
      <br>
      <small>Admin Control System</small>
    </footer>

  </main>

  <script src="./app.js"></script>

</body>
</html>
